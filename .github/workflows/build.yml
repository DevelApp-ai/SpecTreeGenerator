name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          source-url: https://nuget.pkg.github.com/DevelApp-ai/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}

      - name: Restore
        run: dotnet restore SpecTreeGenerator.sln

      - name: Build (warnings as errors)
        run: dotnet build SpecTreeGenerator.sln -c Release --no-restore /warnaserror

      - name: Test
        run: dotnet test SpecTreeGenerator.sln -c Release --no-build

      - name: Verify formatting
        run: dotnet format SpecTreeGenerator.sln --verify-no-changes
