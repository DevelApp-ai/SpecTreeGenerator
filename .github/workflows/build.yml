name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GeneticSpecOptimizer.sln

      - name: Build (warnings as errors)
        run: dotnet build GeneticSpecOptimizer.sln -c Release --no-restore /warnaserror

      - name: Test
        run: dotnet test GeneticSpecOptimizer.sln -c Release --no-build

      - name: Verify formatting
        run: dotnet format GeneticSpecOptimizer.sln --verify-no-changes
