name: measurements

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Repositories measured by the battery. SpecTreeGenerator itself is measured
  # from the local checkout; the others require a token that can read them.
  MEASURE_SIBLING_REPOS: >-
    DevelApp-ai/CitizenCodeLab
    DevelApp-ai/EventStorming

jobs:
  measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          source-url: https://nuget.pkg.github.com/DevelApp-ai/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
      - name: Publish measurement tool
        run: dotnet publish src/Measurements/SpecTreeGenerator.Measurements.csproj -c Release -o ./artifacts/measure
      - name: Stage measured repositories
        env:
          # REPO_READ_TOKEN must be a PAT with read access to the sibling
          # private repositories. When unset (or lacking access), those repos
          # are skipped with a recorded warning instead of failing the run.
          CLONE_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        run: |
          set -u
          mkdir -p repos results
          echo "DevelApp-ai/SpecTreeGenerator $(git rev-parse HEAD)" >> results/manifest.txt
          for repo in $MEASURE_SIBLING_REPOS; do
            name=$(basename "$repo")
            if [ -n "${CLONE_TOKEN:-}" ] \
              && git clone --depth 1 "https://x-access-token:${CLONE_TOKEN}@github.com/${repo}.git" "repos/$name" 2>/dev/null; then
              echo "$repo $(git -C "repos/$name" rev-parse HEAD)" >> results/manifest.txt
            else
              echo "WARNING: no read access to $repo (set the REPO_READ_TOKEN secret); skipping" | tee -a results/skipped-repos.txt
            fi
          done
      - name: Run measurement battery
        run: |
          MEASURE=./artifacts/measure/spectree-measure
          mkdir -p repos/SpecTreeGenerator
          rsync -a --exclude artifacts --exclude repos --exclude results . repos/SpecTreeGenerator/
          for repo in repos/*/; do
            name=$(basename "$repo")
            echo "Measuring $name"
            mkdir -p "results/$name"
            timeout 20m $MEASURE hierarchy --source "$repo" --output "results/$name/hierarchy" --max-minutes 1 --seed 42 \
              > "results/$name/hierarchy.json" 2> "results/$name/hierarchy.log" \
              || { echo "hierarchy measurement failed for $name"; rm -f "results/$name/hierarchy.json"; }
            timeout 20m $MEASURE optimizers --source "$repo" --max-minutes 1 --seed 42 \
              > "results/$name/optimizers.json" 2> "results/$name/optimizers.log" \
              || { echo "optimizers measurement failed for $name"; rm -f "results/$name/optimizers.json"; }
            timeout 10m $MEASURE languages --source "$repo" \
              > "results/$name/languages.json" 2> "results/$name/languages.log" \
              || { echo "languages measurement failed for $name"; rm -f "results/$name/languages.json"; }
          done
          timeout 30m $MEASURE sensitivity --source repos/SpecTreeGenerator --max-minutes 1 --seed 42 \
            > results/sensitivity.json 2> results/sensitivity.log \
            || { echo "sensitivity measurement failed"; rm -f results/sensitivity.json; }
      - name: Upload measurement results
        uses: actions/upload-artifact@v4
        with:
          name: measurements-results
          path: results/
